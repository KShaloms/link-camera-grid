[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; PC와 보드 사이의 USB 모니터 속도입니다. PLC의 RS-485 속도는 main.cpp의 Serial2.begin에서 지정합니다.
monitor_speed = 115200
; 모니터를 열면 수신 시각을 표시하고 PC에 로그 파일로 기록합니다.
monitor_filters = time, log2file

lib_deps =
    emelianov/modbus-esp8266 @ ^4.1.0

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

monitor_rts = 0
monitor_dtr = 0

upload_port=COM3